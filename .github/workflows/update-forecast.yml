name: Update forecast

on:
  schedule:
    # NOAA runs start at 00, 06, 12, 18 UTC and finish uploading about 5 hours later
    - cron: "30 5,11,17,23 * * *"
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write           # lets the job commit the new forecast.json

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python forecast/forecast.py
      - name: Commit the new forecast
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add docs/data/forecast.json
          git diff --cached --quiet || git commit -m "Update forecast"
          git push
